<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Will you be my Valentine? 💘</h1>

    <div class="buttons">
      <button id="yes">YES 💕</button>
      <button id="no">NO 😠</button>
    </div>
  </div>

  <!-- YES popup -->
  <div id="yes-popup" class="hidden">
    <img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="Cute dog GIF">
    <h2>YAY!!! 💖 YOU’RE MY VALENTINE 💖</h2>
    <p id="date-text">We date on Feb 28! 🗓️</p>
    <button id="close-popup">Close</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
